name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or list of steps. Include sample data if it matters, but keep it small.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Package version:
        - Python version:
        - OS:
