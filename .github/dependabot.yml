# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"  # Location of package manifests
    schedule:
      interval: "monthly"
    target-branch: "main"  # Consider using 'dev' so updates do not break compatibility with main

  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    # sync-with-uv keeps these revs matched to uv.lock, so they're bumped there instead
    ignore:
      - dependency-name: "https://github.com/astral-sh/ruff-pre-commit"
      - dependency-name: "https://github.com/facebook/pyrefly-pre-commit"
