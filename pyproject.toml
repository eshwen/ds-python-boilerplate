[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"


[project]
name = "my_project"
version = "0.10.2"
description = "Boilerplate for data science projects in Python"
authors = [
    { name = "Eshwen Bhal, PhD", email = "milanman.eshb@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Terminal colours
    "colorama",
    # Data processing
    "pandas[excel]>=3.0.0,<4",
    "polars>2.0.0,<3",
    # Machine learning
    #"tensorflow-macos",
    "scikit-learn",
    # Data validation
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.14.2,<3",
    "pandera>=0.32.1,<1",
    # SQL databases
    "sqlalchemy>=2.0.52,<3",
    # APIs
    "fastapi>=0.141.1,<1",
    "uvicorn",
    "requests>=2.34.2,<3",
    # Stats
    "statsmodels",
    # Visualisation
    "matplotlib",
    "seaborn",
    "plotly",
    # Configs
    "pyyaml",
]


[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "test" },
    { include-group = "jupyter" },
]
lint = [
    "pre-commit>=4.7.0,<5",
    "ruff>=0.17.3,<0.18",
]
type = [
    "pyrefly>=1.4.0,<2",
    "pandas-stubs>=2.3.3",
]
test = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
]
jupyter = [
    "jupyter",
    "jupyterlab",
    "voila",
]
docs = [
    "zensical>=0.1,<0.2",
    "mkdocstrings-python>=2.0.4,<3",
    "mkdocs-api-autonav>=0.4.0,<0.5",
    "mike @ git+https://github.com/squidfunk/mike.git@2.2.0+zensical-0.1.0",
]


[tool.uv]
required-version = ">=0.12.0,<0.14"


[tool.sync-with-uv.repo-to-package]
# The hook pins pyrefly to its own rev, so keep that matched to uv.lock like ruff
"https://github.com/facebook/pyrefly-pre-commit" = "pyrefly"


[tool.pyrefly]
preset = "strict"
project-includes = ["src"]
project-excludes = ["**/tests/"]
python-interpreter-path = ".venv/bin/python3"
python-version = "3.11"

[tool.pyrefly.errors]
implicit-any-type-argument = "ignore"
missing-override-decorator = "ignore"
missing-source = "warn"
string-as-iterable = "warn"
unannotated-return = "error"


[tool.ruff]
target-version = "py311"
line-length = 120


[tool.ruff.lint]
select = [
    "ERA",
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "T10",
    "EM",
    "EXE",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PIE",
    "T20",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SIM",
    "TID",
    "TD",
    "ARG",
    "PTH",
    "I",
    "C90",
    "PD",
    "NPY",
    "N",
    "PERF",
    "E",
    "W",
    "D",
    "F",
    "PGH",
    "PL",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "UP",
    "RUF",
    "TRY",
]

ignore = [
    "FBT001",
    "FBT002",
    "B008",
    "COM812",
    "EM101",
    "EM102",
    "G004",
    "TD002",
    "TD003",
    "N805",
    "D107",
    "D212",
    "D301",
    "PGH003",
    "TRY003",
]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/*" = [
    "D100",
    "D103",
    "S101",
]
# Standalone hook scripts run with fixed commands, not a package
".claude/hooks/*" = ["INP001", "S603"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
# Like Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.pytest]
minversion = "9.0"
addopts = [
    "-v",
    "-s",
    "--cov"
]
testpaths = [
    "tests",
]
asyncio_mode = "auto"


[tool.coverage.run]
branch = true
source = ["my_project"]
omit = [
    "__init__.py"
]


[tool.coverage.report]
show_missing = true
fail_under = 90
